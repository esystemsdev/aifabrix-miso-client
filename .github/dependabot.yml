version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      root-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@aifabrix/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
    groups:
      server-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@aifabrix/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/server/frontend"
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@aifabrix/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
